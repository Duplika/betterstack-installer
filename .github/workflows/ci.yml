name: Validate and attest installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish candidate assets after enabling repository release immutability
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Offline root-fixture tests and public export guard
        run: sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$GITHUB_WORKSPACE/src/agent" "$pythonLocation/bin/python" scripts/check.py

  native-vector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned upstream Vector and run synthetic native tests
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 180 'https://packages.timber.io/vector/0.60.0/vector-0.60.0-x86_64-unknown-linux-gnu.tar.gz' -o /tmp/vector.tar.gz
          printf '%s  %s\n' '89a9f134dcc35a6fbba9cb8ad0fec2d4802657bba6cb1c374a30660ef9456bdc' /tmp/vector.tar.gz | sha256sum --check
          mkdir /tmp/vector-native
          tar -xzf /tmp/vector.tar.gz -C /tmp/vector-native
          PYTHONPATH=src/agent python3 scripts/check_vector.py --vector /tmp/vector-native/vector-x86_64-unknown-linux-gnu/bin/vector

  build:
    needs: [test, native-vector]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build candidate without any runtime credentials
        run: python scripts/build.py --output out/release
      - name: Verify build matches the reviewed committed artifact
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'scripts'); import build; print(build.version())")
          cmp "releases/$version/installer.sh" out/release/installer.sh
          cmp "releases/$version/manifest.json" out/release/manifest.json
          cmp "releases/$version/SHA256SUMS" out/release/SHA256SUMS
      - name: Attest build provenance using short-lived GitHub identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: out/release/installer.sh
          create-storage-record: false
      - name: Keep a downloadable verification bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" out/release/installer.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-installer
          path: out/release/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-installer
          path: out/release
      - name: Refuse existing versions and publish all assets together
        run: |
          set -euo pipefail
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import build; print(build.version())")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; never overwrite published assets." >&2
            exit 1
          fi
          if [[ "$version" != *-rc* ]]; then
            echo "Stable promotion requires a separately reviewed workflow." >&2
            exit 1
          fi
          gh release create "$tag" out/release/installer.sh out/release/manifest.json out/release/SHA256SUMS out/release/installer.sigstore.json --draft --prerelease --target "$GITHUB_SHA" --title "$tag" --notes-file docs/RELEASE-NOTES.md
          gh release edit "$tag" --draft=false --prerelease
